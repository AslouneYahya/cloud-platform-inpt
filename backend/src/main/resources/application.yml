server:
  port: 8080

spring:

  # ── DataSource (PostgreSQL) ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/authdb}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── Redis ────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

  # ── Spring Session (Redis-backed) ────────────────────────────────────────
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: auth:session

# ── Logging ────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    ma.inpt.cloud: INFO
    org.springframework.security: INFO

---
# ── Seed profile ────────────────────────────────────────────────────────────
# Activated by: SPRING_PROFILES_ACTIVE=seed
# Drops and recreates the schema on startup so SeedRunner always starts clean.
spring:
  config:
    activate:
      on-profile: seed
  jpa:
    hibernate:
      ddl-auto: create-drop  # reset DB on seed run
