version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — terminates TLS and routes traffic to backend / frontend
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Spring Boot API server
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/authdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      REDIS_HOST: redis
      MASTER_NODE_URL: https://master.aslouneyahya.com
      MASTER_NODE_ENABLED: "true"
      MASTER_NODE_API_KEY: inpt-cluster-secret-2026
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Vite / React frontend (served directly in dev; built artifacts in prod)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — primary relational datastore
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 7 — session cache / token store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
